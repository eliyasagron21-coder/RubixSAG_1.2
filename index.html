  --accent: #1fa8ff; --accent2: #ff4f9a;
  --panel: rgba(255, 255, 255, 0.92); --panel-border: #2a1f3d;
  --btn: #ffffff; --btn-fg: #2a1f3d; --btn-border: #2a1f3d;
  --primary-bg: #ff4f9a; --primary-fg: #ffffff;
  --radius: 22px; --blur: none;
  --shadow: 0 5px 0 #2a1f3d;
  --font: 'Varela Round', 'Rubik', system-ui, sans-serif; --font-logo: 'Varela Round', 'Rubik', sans-serif;
  --logo-grad: linear-gradient(100deg, #ff4f9a, #ffb800 50%, #1fa8ff);

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-img);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.topbar {
  position: relative; z-index: 6; direction: ltr;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 18px 8px;
}
.brand {
  grid-column: 2; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.brand::before {
  content: ''; position: absolute; left: 50%; top: 42%; width: 260px; height: 90px; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--logo-glow), transparent); opacity: .55; pointer-events: none; z-index: -1;
}
.brand-row { display: flex; align-items: center; gap: 12px; }
.logo-mark { display: inline-flex; filter: drop-shadow(0 0 12px var(--logo-glow)) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35)); animation: mark-in .9s cubic-bezier(.2,1.5,.4,1) both; }
.logo-mark svg { display: block; transform: rotate(-6deg); }
.wordmark {
  font-family: var(--font-logo); font-weight: 800; font-size: clamp(27px, 8.4vw, 36px); letter-spacing: -0.015em; line-height: 1;
  filter: drop-shadow(0 0 14px var(--logo-glow));
}
.wordmark b {
  font-weight: 800;
  background: var(--logo-grad); background-size: 230% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 7s ease-in-out infinite alternate;
}
.byline {
  font: 500 9.5px/1 var(--font); letter-spacing: .3em; text-transform: uppercase;
  color: var(--fg); opacity: .3; padding-inline-start: .3em; white-space: nowrap;
}
body[data-theme="blueprint"] .wordmark { letter-spacing: .02em; font-weight: 600; }
body[data-theme="blueprint"] .wordmark b { font-weight: 600; }
body[data-theme="bauhaus"] .wordmark { text-transform: uppercase; letter-spacing: -0.005em; }
body[data-theme="tabletop"] .wordmark { font-weight: 700; }
body[data-theme="tabletop"] .wordmark b { font-weight: 700; }
body[data-theme="frost"] .wordmark, body[data-theme="playful"] .wordmark { filter: none; }
@keyframes shine { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@keyframes mark-in { from { transform: scale(.6) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
.moves { grid-column: 3; justify-self: end; align-self: end; padding-bottom: 0; font-size: 12.5px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; }
html[dir="rtl"] .moves { direction: rtl; }
.moves b { color: var(--fg); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }

body[data-theme="neon"] { --logo-glow: rgba(122, 92, 255, .6); }
body[data-theme="abyss"] { --logo-glow: rgba(54, 255, 214, .45); }
body[data-theme="sunset"] { --logo-glow: rgba(255, 79, 163, .55); }
body[data-theme="frost"] { --logo-glow: rgba(74, 168, 255, .3); }
body[data-theme="bauhaus"] { --logo-glow: transparent; }
body[data-theme="tabletop"] { --logo-glow: rgba(241, 207, 122, .3); }
body[data-theme="blueprint"] { --logo-glow: transparent; }
body[data-theme="playful"] { --logo-glow: rgba(255, 79, 154, .3); }

#decor { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

/* ---------- stage ---------- */
#stage { position: relative; z-index: 1; min-height: 0; }
.pane {
  position: absolute; inset: 0; width: 100%; height: 100%;
  transition: top .5s cubic-bezier(.2,.8,.2,1), left .5s cubic-bezier(.2,.8,.2,1),
              width .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1),
              border-radius .5s, background .3s;
}
.pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.pane.mini {
  z-index: 3; inset: auto; top: 6px; left: 14px;
  width: clamp(84px, 22vw, 140px); height: clamp(84px, 22vw, 140px);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  cursor: pointer; overflow: hidden;
}
body[data-theme="blueprint"] .pane.mini { border-style: dashed; }
body[data-theme="playful"] .pane.mini { border-width: 2.5px; }
body[data-theme="bauhaus"] .pane.mini { border-width: 2px; }
.swap-hint {
  position: absolute; bottom: 5px; left: 0; right: 0; z-index: 2; text-align: center;
  font: 600 9px/1 var(--font); letter-spacing: 0.16em; color: var(--muted);
  pointer-events: none; opacity: 0; transition: opacity .3s;
}
.pane.mini .swap-hint { opacity: .85; }
.no-gl { display: none; }

.move-chip {
  position: absolute; z-index: 4; top: 8px; left: 50%;
  transform: translate(-50%, -6px) scale(.9); opacity: 0; pointer-events: none;
  min-width: 54px; padding: 7px 16px; text-align: center; direction: ltr;
  font: 700 24px/1 var(--font-logo); color: var(--fg);
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: opacity .15s, transform .2s;
}
.move-chip.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.move-chip.dim { color: var(--muted); }
body[data-theme="bauhaus"] .move-chip, body[data-theme="blueprint"] .move-chip { border-radius: var(--radius); }

/* ---------- corner buttons ---------- */
.corners {
  position: relative; z-index: 8; direction: ltr;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 4px 18px max(18px, env(safe-area-inset-bottom));
  pointer-events: none;
}
.corner { position: relative; pointer-events: auto; }
.fab {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--panel); color: var(--btn-fg);
  border: 1px solid var(--btn-border);
  box-shadow: var(--shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: transform .18s, box-shadow .25s, background .3s;
}
.fab-lg { width: 66px; height: 66px; }
.fab:active { transform: scale(.92); }
.fab svg { width: 22px; height: 22px; }
.fab .ic-open { fill: currentColor; opacity: .9; }
.fab .ic-close { display: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.fab.active .ic-open { display: none; }
.fab.active .ic-close { display: block; }
.fab-lg .theme-icon svg { width: 32px; height: 32px; display: block; }
body[data-theme="bauhaus"] .fab, body[data-theme="blueprint"] .fab { border-radius: var(--radius); }
body[data-theme="playful"] .fab { border-width: 2.5px; background: #fff; }
body[data-theme="neon"] .fab-lg, body[data-theme="abyss"] .fab-lg, body[data-theme="sunset"] .fab-lg {
  box-shadow: var(--shadow), 0 0 28px rgba(122, 92, 255, 0.28);
}
body[data-theme="neon"] .fab.active, body[data-theme="abyss"] .fab.active, body[data-theme="sunset"] .fab.active {
  border-color: var(--accent);
}

/* ---------- popovers ---------- */
.pop {
  position: absolute; bottom: calc(100% + 12px);
  min-width: 232px; padding: 12px;
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--panel-border); border-radius: calc(var(--radius) + 2px);
  box-shadow: var(--shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  opacity: 0; transform: translateY(8px) scale(.94);
  transition: opacity .18s, transform .22s cubic-bezier(.2,1.2,.4,1);
  display: flex; flex-direction: column; gap: 8px;
}
html[dir="rtl"] .pop { direction: rtl; }
html[dir="ltr"] .pop { direction: ltr; }
.pop-start { left: 0; transform-origin: bottom left; }
.pop-end { right: 0; transform-origin: bottom right; }
.pop.open { opacity: 1; transform: none; }
body[data-theme="neon"] .pop, body[data-theme="abyss"] .pop, body[data-theme="sunset"] .pop { background: color-mix(in srgb, var(--bg) 72%, transparent); }
.pop svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.pop-primary {
  height: 50px; padding: 0 18px; border-radius: calc(var(--radius) - 4px);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--primary-bg); color: var(--primary-fg);
  font-weight: 700; font-size: 16px;
  transition: transform .15s, filter .2s;
}
.pop-primary:active { transform: scale(.97); }
body[data-theme="playful"] .pop-primary, body[data-theme="bauhaus"] .pop-primary { border: 2px solid var(--btn-border); }
.pop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pop-item {
  height: 46px; padding: 0 12px; border-radius: calc(var(--radius) - 6px);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--btn); color: var(--btn-fg); border: 1px solid var(--btn-border);
  font-size: 14px; font-weight: 600;
  transition: transform .15s, opacity .2s, border-color .2s, color .2s;
}
.pop-item:active { transform: scale(.96); }
.pop-item:disabled { opacity: .35; pointer-events: none; }
.pop-item .lbl-confirm { display: none; }
.pop-item.confirm { color: var(--accent2); border-color: var(--accent2); }
.pop-item.confirm .lbl { display: none; }
.pop-item.confirm .lbl-confirm { display: inline; }
.pop-sep { height: 1px; background: var(--panel-border); margin: 2px 0; opacity: .8; }
.lang-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); padding: 0 2px; }
.seg { display: flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--btn); border: 1px solid var(--btn-border); direction: ltr; }
.seg button { min-width: 44px; height: 30px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
.seg button.on { background: var(--primary-bg); color: var(--primary-fg); }
body[data-theme="bauhaus"] .seg, body[data-theme="bauhaus"] .seg button,
body[data-theme="blueprint"] .seg, body[data-theme="blueprint"] .seg button { border-radius: var(--radius); }
.pop-link { align-self: center; font-size: 12.5px; color: var(--muted); padding: 4px 8px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }

.pop-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 2px 2px; }
.theme-grid { display: grid; grid-template-columns: repeat(4, 64px); gap: 10px 8px; }
.theme-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.tile-prev {
  width: 64px; height: 64px; border-radius: calc(var(--radius) - 4px);
  display: grid; place-items: center;
  border: 2px solid transparent; outline: 1px solid var(--panel-border);
  transition: transform .15s, border-color .2s;
}
.theme-tile:active .tile-prev { transform: scale(.94); }
.theme-tile.on .tile-prev { border-color: var(--accent); outline-color: transparent; }
.tile-name { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.theme-tile.on .tile-name { color: var(--fg); font-weight: 600; }
@media (max-width: 360px) { .theme-grid { grid-template-columns: repeat(4, 56px); } .tile-prev { width: 56px; height: 56px; } }

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 20; left: 50%; top: 42%;
  transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
  padding: 20px 34px; text-align: center;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: calc(var(--radius) + 6px);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: transform .45s cubic-bezier(.2,1.6,.4,1), opacity .3s;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.toast-title { font: 700 30px/1.1 var(--font-logo); background: var(--logo-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.toast-sub { color: var(--muted); margin-top: 4px; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

/* ---------- help sheet ---------- */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sheet-wrap.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: min(520px, 100%); padding: 22px 20px max(20px, env(safe-area-inset-bottom));
  background: var(--bg); color: var(--fg);
  border-radius: calc(var(--radius) + 8px) calc(var(--radius) + 8px) 0 0;
  border: 1px solid var(--panel-border); border-bottom: 0;
  transform: translateY(30px); transition: transform .3s;
  max-height: 85dvh; overflow: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.sheet-wrap.open .sheet { transform: none; }
.sheet h2 { margin: 0; font: 700 20px/1.2 var(--font-logo); }
.sheet p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14.5px; }
.sheet ul { margin: 0 0 6px; padding-inline-start: 18px; line-height: 1.6; font-size: 14.5px; }
.sheet li { margin-bottom: 6px; }
.sheet kbd { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 1px 5px; border: 1px solid var(--panel-border); border-radius: 4px; direction: ltr; display: inline-block; }
@media (min-width: 700px) {
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: calc(var(--radius) + 8px); border-bottom: 1px solid var(--panel-border); }
}

/* ---------- article sheet ---------- */
.sheet.article { width: min(640px, 100%); max-height: 88dvh; padding: 0; gap: 0; overflow: hidden; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--panel-border); }

/* ---------- ambient decor per layout ---------- */
.aurora { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; will-change: transform; animation: drift 26s ease-in-out infinite alternate; }
.decor-neon .a1 { width: 60vmax; height: 40vmax; left: -15vmax; top: -10vmax; background: radial-gradient(closest-side, rgba(122, 92, 255, .55), transparent); }
.decor-neon .a2 { width: 55vmax; height: 45vmax; right: -20vmax; bottom: -15vmax; background: radial-gradient(closest-side, rgba(56, 232, 255, .35), transparent); animation-duration: 32s; }
.decor-neon .a3 { width: 40vmax; height: 30vmax; left: 30%; top: 35%; background: radial-gradient(closest-side, rgba(255, 75, 216, .18), transparent); animation-duration: 38s; }
.gridfx {
  position: absolute; inset: 0;
  background:
    linear-gradient(rgba(140, 160, 255, .06) 1px, transparent 1px) 0 0 / 44px 44px,

  -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 50%, #000 0%, transparent 75%);

.decor-abyss .a2 { width: 60vmax; height: 40vmax; right: -25vmax; bottom: -20vmax; background: radial-gradient(closest-side, rgba(123, 47, 209, .3), transparent); animation-duration: 34s; }
.plankton { position: absolute; border-radius: 50%; background: #9ffcea; box-shadow: 0 0 8px #36ffd6; opacity: .6; animation: rise linear infinite; }
@keyframes rise { 0% { transform: translateY(20px); opacity: 0; } 15% { opacity: .7; } 85% { opacity: .5; } 100% { transform: translateY(-160px); opacity: 0; } }

.decor-sunset .sun {
  position: absolute; left: 50%; bottom: 6%; width: 70vmin; height: 70vmin; transform: translateX(-50%);
  border-radius: 50%; opacity: .22;
  background: linear-gradient(180deg, #ffe066 0%, #ff8a3d 45%, #ff3d81 100%);
  -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent 100%); mask-image: linear-gradient(180deg, #000 45%, transparent 100%);

@keyframes grid-run { from { background-position: 0 0, 0 0; } to { background-position: 0 34px, 0 0; } }

.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 30s ease-in-out infinite alternate; }
.decor-frost .b1 { width: 50vmax; height: 50vmax; left: -15vmax; top: -15vmax; background: #ffd0e3; }
.decor-frost .b2 { width: 45vmax; height: 45vmax; right: -15vmax; top: 25%; background: #cfe6ff; animation-duration: 36s; }

.bh { position: absolute; opacity: .9; }

.decor-bauhaus .s { width: 26vmin; height: 26vmin; background: #1f4fd1; left: -8vmin; bottom: 18%; opacity: .12; }
.decor-bauhaus .t { width: 0; height: 0; border-left: 16vmin solid transparent; border-right: 16vmin solid transparent; border-bottom: 28vmin solid #f5b700; right: 12%; bottom: -6vmin; opacity: .2; }

.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 65% at 50% 48%, transparent 55%, rgba(0, 0, 0, .45) 100%); }

.mini-cube {
  position: absolute; width: var(--sz); height: var(--sz);

  0% { transform: translateY(0) rotate(var(--rot)); }

  100% { transform: translateY(0) rotate(var(--rot)); }

@media (max-width: 380px) { .topbar { padding-left: 14px; padding-right: 14px; } .brand-row { gap: 9px; } }
@media (prefers-reduced-motion: reduce) {
  .aurora, .blob, .plankton, .mini-cube, .horizon, .wordmark b, .logo-mark { animation: none; }
  .pane, .toast, .pop { transition: none; }
}

/* face style picker (layouts popover) */
.shape-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; margin-bottom: 6px;
  border-radius: calc(var(--radius) - 2px); background: var(--btn); border: 1px solid var(--btn-border); }
.shape-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px;
  border-radius: calc(var(--radius) - 6px); color: var(--muted); font-size: 12px; font-weight: 600;

.shape-opt svg { width: 24px; height: 24px; stroke-width: 1.8; }

.shape-seg + .pop-title { margin-top: 2px; }

/* ---------- cube size (3D view only, mirrors the mini pane on the other side) ---------- */
.size-ui { position: absolute; z-index: 5; top: 6px; right: 14px; display: none; }
body.view-3d .size-ui { display: block; }
.size-btn {
  width: clamp(84px, 22vw, 140px); height: clamp(84px, 22vw, 140px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--panel-border); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  transition: transform .15s, border-color .2s;
  animation: size-in .45s cubic-bezier(.2,1.2,.4,1);
}
@keyframes size-in { from { opacity: 0; transform: scale(.85); } }
.size-btn:active { transform: scale(.95); }
.size-btn.active { border-color: var(--accent); }
body[data-theme="blueprint"] .size-btn { border-style: dashed; }
body[data-theme="playful"] .size-btn { border-width: 2.5px; }
body[data-theme="bauhaus"] .size-btn { border-width: 2px; }
.size-icon svg { width: clamp(36px, 10vw, 58px); height: auto; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; display: block; }
.size-lbl { font: 700 clamp(13px, 3.4vw, 17px)/1 var(--font); letter-spacing: .04em; direction: ltr; }
.size-pop { top: calc(100% + 10px); bottom: auto; right: 0; left: auto; transform-origin: top right; transform: translateY(-8px) scale(.94); }
.size-pop.open { transform: none; }
.size-grid { direction: ltr; position: relative; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr;
  width: min(300px, calc(100vw - 52px)); aspect-ratio: 1 / 1.02; touch-action: none; }
.size-grid canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.size-grid button { position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
  border-radius: calc(var(--radius) - 4px); border: 1.5px solid transparent; transition: border-color .2s, background .2s; }
.size-grid button span { font: 700 13px/1 var(--font); color: var(--muted); direction: ltr; }
.size-grid button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.size-grid button.on span { color: var(--fg); }

/* =====================================================================
   Motion: spring physics for every control + an iOS-style launch zoom
   ===================================================================== */
:root { --spring: cubic-bezier(.2, 1.45, .4, 1); --spring-soft: cubic-bezier(.25, 1.2, .4, 1); }
@supports (animation-timing-function: linear(0, 1)) {
  :root { --spring: linear(0, 0.078, 0.259, 0.479, 0.692, 0.869, 0.998, 1.079, 1.118, 1.126, 1.112, 1.088, 1.06, 1.033, 1.012, 0.997, 0.988, 0.985, 0.984, 0.986, 0.99, 0.993, 0.996, 0.999, 1.001, 1.002, 1.002, 1.002, 1); --spring-soft: linear(0, 0.063, 0.204, 0.371, 0.533, 0.674, 0.787, 0.873, 0.934, 0.975, 0.999, 1.013, 1.019, 1.02, 1.018, 1.015, 1.012, 1.009, 1.006, 1.004, 1.002, 1.001, 1, 1, 1, 1, 1, 1, 1); }
}

/* press: sink quickly, release with a springy rebound */
.fab, .pop-primary, .pop-item, .tile-prev, .shape-opt, .seg button, .size-btn, .size-grid button, .pop-link, .pane.mini {
  transition-property: transform, opacity, background, color, border-color, box-shadow;
  transition-duration: .55s, .2s, .25s, .25s, .25s, .25s;
  transition-timing-function: var(--spring), ease, ease, ease, ease, ease;
}
.fab:active, .size-btn:active { transform: scale(.88); transition-duration: .12s; transition-timing-function: ease-out; }
.pop-primary:active, .pop-item:active, .shape-opt:active, .seg button:active, .size-grid button:active, .pop-link:active { transform: scale(.93); transition-duration: .1s; transition-timing-function: ease-out; }
.theme-tile:active .tile-prev { transform: scale(.88); transition-duration: .1s; transition-timing-function: ease-out; }
.pane.mini:active { transform: scale(.94); transition-duration: .12s; transition-timing-function: ease-out; }
.theme-tile.on .tile-prev, .shape-opt.on, .size-grid button.on { animation: picked .6s var(--spring); }
@keyframes picked { 0% { transform: scale(.86); } 100% { transform: none; } }

/* main/mini swap glides on a soft spring */
.pane {
  transition: top .7s var(--spring-soft), left .7s var(--spring-soft), width .7s var(--spring-soft), height .7s var(--spring-soft),
              border-radius .5s, background .3s, transform .55s var(--spring);
}

/* popovers grow out of their button and their content cascades in */
.pop { transition: opacity .18s ease, transform .6s var(--spring); transform: translateY(14px) scale(.7); }
.size-pop { transform: translateY(-14px) scale(.7); }
.pop.open, .size-pop.open { transform: none; }
.pop.open > *, .pop.open .theme-tile, .pop.open .shape-opt, .pop.open .size-grid button {
  animation: pop-child .55s var(--spring) backwards;
}
@keyframes pop-child { from { opacity: 0; transform: translateY(10px) scale(.86); } }
.pop.open > *:nth-child(2) { animation-delay: .03s; } .pop.open > *:nth-child(3) { animation-delay: .06s; }
.pop.open > *:nth-child(4) { animation-delay: .09s; } .pop.open > *:nth-child(5) { animation-delay: .12s; }
.pop.open > *:nth-child(6) { animation-delay: .15s; } .pop.open > *:nth-child(7) { animation-delay: .18s; }
.pop.open > *:nth-child(8) { animation-delay: .21s; }
.pop.open .shape-opt:nth-child(2) { animation-delay: .05s; } .pop.open .shape-opt:nth-child(3) { animation-delay: .1s; }
.pop.open .theme-tile:nth-child(1) { animation-delay: .1s; }  .pop.open .theme-tile:nth-child(2) { animation-delay: .13s; }
.pop.open .theme-tile:nth-child(3) { animation-delay: .16s; } .pop.open .theme-tile:nth-child(4) { animation-delay: .19s; }
.pop.open .theme-tile:nth-child(5) { animation-delay: .22s; } .pop.open .theme-tile:nth-child(6) { animation-delay: .25s; }
.pop.open .theme-tile:nth-child(7) { animation-delay: .28s; } .pop.open .theme-tile:nth-child(8) { animation-delay: .31s; }
.pop.open .size-grid button:nth-of-type(2) { animation-delay: .05s; } .pop.open .size-grid button:nth-of-type(3) { animation-delay: .1s; }
.pop.open .size-grid button:nth-of-type(4) { animation-delay: .15s; }
.fab.active { transform: rotate(0) scale(1.06); }

/* toast + sheets */
.toast { transition: transform .7s var(--spring), opacity .25s; }
.sheet { transform: translateY(70%); transition: transform .65s var(--spring-soft); }

/* move counter bumps on every move */
#moveCount { display: inline-block; }
#moveCount.bump { animation: bump .5s var(--spring); }
@keyframes bump { from { transform: scale(1.45); } }

/* launch: everything arrives a bit too big and settles into place, like the iOS home screen */
@keyframes settle { from { opacity: 0; transform: scale(var(--from, 1.2)); filter: blur(var(--blur-in, 6px)); } }
body.intro .brand { animation: settle .9s var(--spring-soft) backwards; --from: 1.3; }
body.intro .moves { animation: settle .9s var(--spring-soft) .08s backwards; --from: 1.5; }
body.intro .pane.mini { animation: settle .9s var(--spring) .16s backwards; --from: 1.6; }
body.intro .corner:first-child .fab { animation: settle .85s var(--spring) .24s backwards; --from: 1.8; --blur-in: 3px; }
body.intro .corner:last-child .fab { animation: settle .85s var(--spring) .3s backwards; --from: 1.8; --blur-in: 3px; }

@media (prefers-reduced-motion: reduce) {
  body.intro *, .pop.open > *, .pop.open .theme-tile, .pop.open .shape-opt, .pop.open .size-grid button, #moveCount.bump { animation: none !important; }
  .pop, .toast, .sheet, .pane { transition-duration: .01s !important; }
}

 \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3\u05D9\u05DD, 9 "\u05E7\u05D1\u05D5\u05E6\u05D5\u05EA" \u05E9\u05DC 12 \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3\u05D9\u05DD (\u05D4\u05D8\u05D1\u05E2\u05D5\u05EA), \u05D5\u05DB\u05DC \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3 \u05E9\u05D9\u05D9\u05DA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05E9\u05EA\u05D9 \u05E7\u05D1\u05D5\u05E6\u05D5\u05EA. \u05D1\u05DC\u05E9\u05D5\u05DF \u05D7\u05D5\u05E4\u05E9\u05D9\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E7\u05E8\u05D5\u05D0 \u05DC\u05D5 "\u05D2\u05E8\u05E3 \u05D4\u05DE\u05D3\u05D1\u05E7\u05D5\u05EA" (\u27E6facelet graph\u27E7).',"\u05D9\u05E9 \u05D3\u05E8\u05DA \u05E0\u05E7\u05D9\u05D9\u05D4 \u05DC\u05D4\u05E1\u05EA\u05DB\u05DC \u05E2\u05DC \u05D6\u05D4 \u05D1\u05EA\u05D5\u05E8\u05EA \u05D4\u05D2\u05E8\u05E4\u05D9\u05DD. \u05D0\u05DD \u05D4\u05D5\u05E4\u05DB\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E4\u05E7\u05D9\u05D3\u05D9\u05DD, \u05DB\u05E9\u05DB\u05DC \u05DE\u05E2\u05D2\u05DC \u05D4\u05D5\u05D0 \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3 \u05D5\u05DB\u05DC \u05DB\u05D3\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05E7\u05E9\u05EA \u05D1\u05D9\u05DF \u05E9\u05E0\u05D9 \u05D4\u05DE\u05E2\u05D2\u05DC\u05D9\u05DD \u05E9\u05E2\u05DC\u05D9\u05D4\u05DD \u05D4\u05D5\u05D0 \u05D9\u05D5\u05E9\u05D1, \u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D2\u05E8\u05E3 \u05E2\u05DD 9 \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3\u05D9\u05DD. \u05DE\u05E2\u05D2\u05DC\u05D9\u05DD \u05DE\u05D0\u05D5\u05EA\u05D4 \u05DE\u05E9\u05E4\u05D7\u05D4 \u05DC\u05D0 \u05D7\u05D5\u05DC\u05E7\u05D9\u05DD \u05DB\u05D3\u05D5\u05E8\u05D9\u05DD, \u05D5\u05DC\u05DB\u05DC \u05E9\u05E0\u05D9 \u05DE\u05E2\u05D2\u05DC\u05D9\u05DD \u05DE\u05DE\u05E9\u05E4\u05D7\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA \u05D9\u05E9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E9\u05E0\u05D9 \u05DB\u05D3\u05D5\u05E8\u05D9\u05DD \u05DE\u05E9\u05D5\u05EA\u05E4\u05D9\u05DD. \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05D2\u05E8\u05E3 \u05D4\u05D3\u05D5\u05BE\u05E6\u05D3\u05D3\u05D9 \u05D4\u05E9\u05DC\u05DD \u05DE\u05E9\u05DC\u05D5\u05E9\u05D4 \u05D7\u05DC\u05E7\u05D9\u05DD, \u27E6K\u2083,\u2083,\u2083\u27E7, \u05DB\u05E9\u05DB\u05DC \u05E7\u05E9\u05EA \u05D1\u05D5 \u05DB\u05E4\u05D5\u05DC\u05D4: 27 \u05E7\u05E9\u05EA\u05D5\u05EA \u05DB\u05E4\u05D5\u05DC\u05D5\u05EA \u05D4\u05DF 54 \u05D4\u05DE\u05D3\u05D1\u05E7\u05D5\u05EA.",'\u05D7\u05E9\u05D5\u05D1 \u05DC\u05D0 \u05DC\u05D4\u05EA\u05D1\u05DC\u05D1\u05DC \u05E2\u05DD "\u05D2\u05E8\u05E3 \u05E7\u05D9\u05D9\u05DC\u05D9" \u05E9\u05DC \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4. \u05D6\u05D4 \u05D2\u05E8\u05E3 \u05D0\u05D7\u05E8 \u05DC\u05D2\u05DE\u05E8\u05D9, \u05D5\u05D2\u05D3\u05D5\u05DC \u05D1\u05D4\u05E8\u05D1\u05D4 (\u05E8\u05D0\u05D4 \u05D1\u05D4\u05DE\u05E9\u05DA). \u05D4\u05D2\u05E8\u05E3 \u05E9\u05E2\u05DC \u05D4\u05DE\u05E1\u05DA \u05DC\u05D0 \u05DE\u05EA\u05D0\u05E8 \u05DE\u05E6\u05D1\u05D9\u05DD \u05E9\u05DC \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4. \u05D4\u05D5\u05D0 \u05DE\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D4\u05DE\u05D1\u05E0\u05D4 \u05E9\u05DC \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4 \u05E2\u05E6\u05DE\u05D4.']},{h:"\u05D4\u05E7\u05E9\u05E8 \u05DC\u05E7\u05D5\u05D1\u05D9\u05D4 \u05D4\u05D4\u05D5\u05E0\u05D2\u05E8\u05D9\u05EA",p:["\u05E7\u05D5\u05D1\u05D9\u05D9\u05EA \u05E8\u05D5\u05D1\u05D9\u05E7 \u05D4\u05D9\u05D0 \u05D1\u05E2\u05E6\u05DD \u05DE\u05DB\u05D5\u05E0\u05D4 \u05E9\u05DE\u05E2\u05E8\u05D1\u05D1\u05EA 54 \u05DE\u05D3\u05D1\u05E7\u05D5\u05EA. \u05DB\u05DC \u05E1\u05D9\u05D1\u05D5\u05D1 \u05E8\u05D1\u05E2 \u05E9\u05DC \u05E4\u05D0\u05D4 \u05D4\u05D5\u05D0 \u05EA\u05DE\u05D5\u05E8\u05D4 \u05E9\u05DC \u05D4\u05DE\u05D3\u05D1\u05E7\u05D5\u05EA: \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05D7\u05D6\u05D5\u05E8\u05D9\u05DD \u05E9\u05DC \u05D0\u05E8\u05D1\u05E2 \u05DE\u05D3\u05D1\u05E7\u05D5\u05EA (\u05E9\u05E0\u05D9\u05D9\u05DD \u05D1\u05E4\u05D0\u05D4 \u05E2\u05E6\u05DE\u05D4 \u05D5\u05E9\u05DC\u05D5\u05E9\u05D4 \u05D1\u05D8\u05D1\u05E2\u05EA \u05E9\u05E1\u05D1\u05D9\u05D1\u05D4), \u05DB\u05E9\u05D4\u05DE\u05D3\u05D1\u05E7\u05D4 \u05E9\u05D1\u05DE\u05E8\u05DB\u05D6 \u05D4\u05E4\u05D0\u05D4 \u05E0\u05E9\u05D0\u05E8\u05EA \u05D1\u05DE\u05E7\u05D5\u05DE\u05D4. \u05D4\u05D8\u05D1\u05E2\u05D5\u05EA \u05D1\u05D2\u05E8\u05E3 \u05D4\u05DF \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05DE\u05D7\u05D6\u05D5\u05E8\u05D9\u05DD \u05D4\u05D0\u05DC\u05D4.",'\u05D0\u05D5\u05E1\u05E3 \u05DB\u05DC \u05D4\u05EA\u05DE\u05D5\u05E8\u05D5\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05D2\u05D9\u05E2 \u05D0\u05DC\u05D9\u05D4\u05DF \u05DE\u05D4\u05DE\u05E6\u05D1 \u05D4\u05E4\u05EA\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05D7\u05D1\u05D5\u05E8\u05D4 \u05DE\u05EA\u05DE\u05D8\u05D9\u05EA, "\u05D7\u05D1\u05D5\u05E8\u05EA \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4". \u05D2\u05D5\u05D3\u05DC\u05D4 \u27E643,252,003,274,489,856,000\u27E7, \u05DB\u05DC\u05D5\u05DE\u05E8 \u05DB-\u27E64.3 \xD7 10\xB9\u2079\u27E7 \u05DE\u05E6\u05D1\u05D9\u05DD. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D7\u05E9\u05D1 \u05D0\u05D5\u05EA\u05D4 \u05DB\u05DA: \u27E68!\u27E7 \u05E1\u05D9\u05D3\u05D5\u05E8\u05D9\u05DD \u05E9\u05DC \u05D4\u05E4\u05D9\u05E0\u05D5\u05EA, \u05DB\u05E4\u05D5\u05DC \u27E63\u2077\u27E7 \u05E1\u05D9\u05D1\u05D5\u05D1\u05D9\u05DD \u05E9\u05DC \u05D4\u05E4\u05D9\u05E0\u05D5\u05EA, \u05DB\u05E4\u05D5\u05DC \u27E612!/2\u27E7 \u05E1\u05D9\u05D3\u05D5\u05E8\u05D9\u05DD \u05E9\u05DC \u05D4\u05E7\u05E6\u05D5\u05D5\u05EA, \u05DB\u05E4\u05D5\u05DC \u27E62\xB9\xB9\u27E7 \u05D4\u05D9\u05E4\u05D5\u05DB\u05D9\u05DD \u05E9\u05DC \u05D4\u05E7\u05E6\u05D5\u05D5\u05EA. \u05E9\u05DC\u05D5\u05E9\u05EA \u05D4\u05DE\u05D7\u05E1\u05D5\u05DE\u05D9\u05DD (\u05E1\u05D9\u05D1\u05D5\u05D1 \u05D4\u05E4\u05D9\u05E0\u05D5\u05EA, \u05D4\u05D9\u05E4\u05D5\u05DA \u05D4\u05E7\u05E6\u05D5\u05D5\u05EA \u05D5\u05D4\u05D6\u05D5\u05D2\u05D9\u05D5\u05EA) \u05D4\u05DD \u05D4\u05E1\u05D9\u05D1\u05D4 \u05E9\u05E8\u05E7 \u05D0\u05D7\u05D3 \u05DE\u05DB\u05DC 12 \u05D4\u05E8\u05DB\u05D1\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8\u05D9\u05D5\u05EA \u05E9\u05DC \u05D7\u05DC\u05E7\u05D9 \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4 \u05E0\u05D9\u05EA\u05DF \u05DC\u05E4\u05EA\u05E8\u05D5\u05DF.',"\u05DB\u05D3\u05D9 \u05DC\u05D4\u05E8\u05D2\u05D9\u05E9 \u05D0\u05EA \u05D4\u05D2\u05D5\u05D3\u05DC: \u05D0\u05DD \u05D4\u05D9\u05D9\u05EA \u05E2\u05D5\u05D1\u05E8 \u05E2\u05DC \u05DB\u05DC \u05D4\u05DE\u05E6\u05D1\u05D9\u05DD \u05D1\u05DE\u05D4\u05DC\u05DA \u05D0\u05D7\u05D3 \u05D1\u05E9\u05E0\u05D9\u05D9\u05D4, \u05D6\u05D4 \u05D4\u05D9\u05D4 \u05DC\u05D5\u05E7\u05D7 \u05DB-\u27E61.4\u27E7 \u05D8\u05E8\u05D9\u05DC\u05D9\u05D5\u05DF \u05E9\u05E0\u05D4."]},{h:"\u05D2\u05E8\u05E3 \u05E7\u05D9\u05D9\u05DC\u05D9 \u05D5\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05DC",p:['\u05D9\u05E9 \u05D2\u05DD \u05D2\u05E8\u05E3 \u05E2\u05E0\u05E7 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05EA\u05D0\u05E8 \u05D0\u05EA \u05DB\u05DC \u05D4\u05DE\u05E6\u05D1\u05D9\u05DD. \u05DB\u05DC \u05DE\u05E6\u05D1 \u05E9\u05DC \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4 \u05D4\u05D5\u05D0 \u05E7\u05D5\u05D3\u05E7\u05D5\u05D3, \u05D5\u05DB\u05DC \u05E1\u05D9\u05D1\u05D5\u05D1 \u05E9\u05DC \u05E4\u05D0\u05D4 \u05DE\u05D7\u05D1\u05E8 \u05E9\u05E0\u05D9 \u05DE\u05E6\u05D1\u05D9\u05DD. \u05D6\u05D4 "\u05D2\u05E8\u05E3 \u05E7\u05D9\u05D9\u05DC\u05D9" \u05E9\u05DC \u05D4\u05D7\u05D1\u05D5\u05E8\u05D4, \u05E2\u05DC \u05E9\u05DD \u05D4\u05DE\u05EA\u05DE\u05D8\u05D9\u05E7\u05D0\u05D9 \u05D4\u05D1\u05E8\u05D9\u05D8\u05D9 \u05D0\u05E8\u05EA\u05D5\u05E8 \u05E7\u05D9\u05D9\u05DC\u05D9, \u05E9\u05D4\u05E6\u05D9\u05E2 \u05D1-1878 \u05DC\u05E6\u05D9\u05D9\u05E8 \u05D7\u05D1\u05D5\u05E8\u05D5\u05EA \u05DB\u05D2\u05E8\u05E4\u05D9\u05DD.',`\u05E4\u05EA\u05E8\u05D5\u05DF \u05E7\u05D5\u05D1\u05D9\u05D4 \u05D4\u05D5\u05D0 \u05DE\u05E1\u05DC\u05D5\u05DC \u05D1\u05D2\u05E8\u05E3 \u05D4\u05D6\u05D4, \u05DE\u05D4\u05DE\u05E6\u05D1 \u05D4\u05DE\u05E2\u05D5\u05E8\u05D1\u05D1 \u05D0\u05DC \u05D4\u05DE\u05E6\u05D1 \u05D4\u05E4\u05EA\u05D5\u05E8. \u05D4\u05DE\u05E1\u05DC\u05D5\u05DC \u05D4\u05E7\u05E6\u05E8 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05D4\u05D5\u05D0 \u05D4\u05E4\u05EA\u05E8\u05D5\u05DF \u05D4\u05D8\u05D5\u05D1 \u05D1\u05D9\u05D5\u05EA\u05E8. \u05D1\u05E7\u05D5\u05D1\u05D9\u05D4 3\xD73 \u05D4\u05DE\u05E8\u05D7\u05E7 \u05D4\u05D2\u05D3\u05D5\u05DC \u05D1\u05D9\u05D5\u05EA\u05E8 \u05D1\u05D9\u05DF \u05E9\u05E0\u05D9 \u05DE\u05E6\u05D1\u05D9\u05DD \u05D4\u05D5\u05D0 20 \u05DE\u05D4\u05DC\u05DB\u05D9\u05DD, \u05D5\u05D4\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D6\u05D4 \u05E0\u05E7\u05E8\u05D0 "\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05DC" (\u27E6God's number\u27E7). \u05D6\u05D4\u05D5 \u05D4\u05E7\u05D5\u05D8\u05E8 \u05E9\u05DC \u05D2\u05E8\u05E3 \u05E7\u05D9\u05D9\u05DC\u05D9, \u05D5\u05DB\u05DC \u05E7\u05D5\u05D1\u05D9\u05D4, \u05DE\u05DB\u05DC \u05E2\u05E8\u05D1\u05D5\u05D1, \u05E0\u05E4\u05EA\u05E8\u05EA \u05D1-20 \u05DE\u05D4\u05DC\u05DB\u05D9\u05DD \u05DC\u05DB\u05DC \u05D4\u05D9\u05D5\u05EA\u05E8.`]},{h:"\u05E0\u05E1\u05D4 \u05D1\u05E2\u05E6\u05DE\u05DA",p:[`\u05D1\u05E6\u05E2 \u05D1\u05E8\u05E6\u05E3 \u05D0\u05EA \u05D0\u05E8\u05D1\u05E2\u05EA \u05D4\u05DE\u05D4\u05DC\u05DB\u05D9\u05DD \u27E6R, U, R', U'\u27E7 (\u05D1\u05DE\u05E7\u05DC\u05D3\u05EA: \u27E6R, U\u27E7, \u05D5\u05D0\u05D6 \u27E6Shift+R, Shift+U\u27E7), \u05D5\u05EA\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05E8\u05E6\u05E3. \u05D0\u05D7\u05E8\u05D9 \u05E9\u05E9 \u05D7\u05D6\u05E8\u05D5\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05E7\u05D5\u05D1\u05D9\u05D4 \u05D7\u05D5\u05D6\u05E8\u05EA \u05DC\u05DE\u05E6\u05D1 \u05D4\u05D4\u05EA\u05D7\u05DC\u05EA\u05D9. \u05D6\u05D4 "\u05D4\u05E1\u05D3\u05E8" \u05E9\u05DC \u05D4\u05E8\u05E6\u05E3, \u05DE\u05D5\u05E9\u05D2 \u05DE\u05E8\u05DB\u05D6\u05D9 \u05D1\u05EA\u05D5\u05E8\u05EA \u05D4\u05D7\u05D1\u05D5\u05E8\u05D5\u05EA. \u05D1\u05D2\u05E8\u05E3 \u05EA\u05E8\u05D0\u05D4 \u05D0\u05EA \u05D4\u05DB\u05D3\u05D5\u05E8\u05D9\u05DD \u05E0\u05E2\u05D9\u05DD \u05DC\u05D0\u05D5\u05E8\u05DA \u05D4\u05DE\u05E2\u05D2\u05DC\u05D9\u05DD \u05D5\u05D0\u05D7\u05E8 \u05DB\u05DA \u05D7\u 9\u05D3 \u05E1\u05D9\u05E0\u05D2\u05DE\u05E1\u05D8\u05E8.`,note:"\u05D4\u05E2\u05E8\u05D4: \u05D4\u05EA\u05D9\u05D0\u05D5\u05E8 \u05DB\u05D0\u05DF \u05DE\u05D1\u05D5\u05E1\u05E1 \u05E2\u05DC \u05D4\u05DE\u05D1\u05E0\u05D4 \u05E9\u05DE\u05D5\u05DE\u05E9 \u05D1\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D4 \u05D4\u05D6\u05D0\u05EA, \u05D5\u05E2\u05E9\u05D5\u05D9 \u05DC\u05D4\u05D9\u05D5\u05EA \u05DE\u05D5\u05E6\u05D2 \u05D0\u05D7\u05E8\u05EA \u05D1\u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D0\u05D7\u05E8\u05D9\u05DD."},en:{title:"The graph behind the cube",lead:"What you are looking at, what it is called in mathematics, and why the Hungarian cube is one of the nicest places to meet group theory and graph theory.",stats:[["54","balls (stickers)"],["9","circles (layers)"],["2","circles per ball"],["20","God's number"]],sections:[{h:"What you are looking at",p:["Every ball is one sticker of the cube. There are 54: six faces with nine stickers each. Every circle is one layer of the cube, meaning the ring of stickers that turns together when you turn that layer.","The circles come in three families, one per axis (left-right, up-down, front-back), with three circles in each: an outer layer, the middle slice, and the other outer layer. Any two families cross in two places, and those two places are two opposite faces of the cube. That is why the balls form six clusters, like the six faces.","Turning a circle moves each ball on it to the spot of the next ball, in steps of a quarter circle. On an outer layer the face at its end turns too, which is why the balls inside the circle move as well."]},{h:"What it is called",p:['Honesty first: I do not know of one standard name for this graph. The precise description is an incidence structure of stickers and layers: 54 vertices, 9 "groups" of 12 vertices (the rings), and every vertex belongs to exactly two groups. Informally you can call it the "facelet graph".',"There is a clean way to see it in graph theory. Swap the roles, so every circle becomes a vertex and every ball becomes an edge between the two circles it sits on, and you get a graph on 9 vertices. Circles of the same family share no balls, and any two circles from different families share exactly two. The result is the complete tripartite graph K\u2083,\u2083,\u2083 with every edge doubled: 27 doubled edges are the 54 stickers.",'Do not confuse it with the "Cayley graph" of the cube. That is a completely different and far larger graph (see below). The graph on the screen does not describe states of the cube. It describes the structure of the cube itself.']},{h:"The link to the Hungarian cube",p:["A Rubik's Cube is really a machine that shuffles 54 stickers. A quarter turn of a face is a permutation of the stickers: five cycles of four stickers (two on the face itself and three on the ring around it), while the center sticker of the face stays put. The rings in the graph are exactly those cycles.",'The collection of all permutations reachable from the solved state is a mathematical group, the "cube group". Its size is 43,252,003,274,489,856,000, about 4.3 \xD7 10\xB9\u2079 states. You can compute it: 8! arrangements of the corners, times 3\u2077 corner twists, times 12!/2 arrangements of the edges, times 2\xB9\xB9 edge flips. These three constraints (corner twist, edge flip and parity) are why only one in 12 ways of putting the pieces together can be solved.',"To feel the size: checking every state at one move per second would take about 1.4 trillion years."]},{h:"Cayley graph and God's number",p:['There is also a gigantic graph that does describe all the states. Every state of the cube is a vertex, and every face turn joins two states. This is the "Cayley graph" of the group, named after the British mathematician Arthur Cayley, who proposed drawing groups as graphs in 1878.',`Solving a cube is a path in that graph, from the scrambled state to the solved one, and the shortest path is the best solution. On the 3\xD73 the largest distance between any two states is 20 moves. That number is called "God's number". It is the diameter of the Cayley graph: every cube, from any scramble, can be solved in 20 moves or fewer.`]},{h:"Try it yourself",p:[`Do the four moves R, U, R', U' in a row (on a keyboard: R, U, then Shift+R, Shift+U) and repeat the sequence. After exactly six repetitions the cube returns to its starting state. That is the "order" of the sequence, a central idea in group theory. On the graph you will see the balls travel along the circles and then come home.`]}],timelineTitle:"Timeline",timeline:[["1736","Leonhard Euler solves the K\xF6nigsberg bridges puzzle and lays the foundation of graph theory."],["1832","\xC9variste Galois, killed in a duel at 20, leaves behind the ideas that became group theory."],["1878","Arthur Cayley shows how to draw a group as a graph. The Cayley graph is born."],["1974","Ern\u0151 Rubik, an architect and lecturer in Budapest, builds the cube to show his students a geometry problem. He did not set out to make a toy."],["1980",`The cube goes on worldwide sale as "Rubik's Cube". David Singmaster publishes the first mathematical analysis around then, with the R U F L D B notation still used today.`],["1981","Morwen Thistlethwaite proves that every cube can be solved in at most 52 moves."],["1992","Herbert Kociemba publishes the two-phase algorithm, still at the base of fast solvers."],["2010","Rokicki, Kociemba, Davidson and Dethridge prove with Google's computers that God's number is 20."],["2014","Rokicki and Davidson prove that if you count only quarter turns, the diameter is 26."]],termsTitle:"Learn more",terms:[["Permutation group","A collection of rearrangements that can be combined with each other. It is the structure hiding behind every move."],["Cayley graph","A graph whose vertices are the elements of a group and whose edges are the basic operations. Here: cube states and face turns."],["Order of an element","How many times you repeat a sequence of moves before the cube returns to its starting state."],["Diameter of a graph","The largest distance between two vertices. For the cube it is God's number."]],books:`Reading: "Adventures in Group Theory" by David Joyner, and "Notes on Rubik's Magic Cube" by David Singmaster.`,note:"Note: this description is based on the structure implemented in this app and may be presented differently in other sources."}},O=i=>String(i).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/⟦/g,'<bdi dir="ltr">').replace(/⟧/g,"</bdi>");function we(i){let t=jt[i];return`
